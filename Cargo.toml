[package]
name = "generic_ringbuffers"
version = "0.1.0"
edition = "2021"

[dependencies]
fastrand = "2.3.0"
rand = "0.9.1"
ringbuf = "0.4.8"
ringbuffer = "0.15.0"
tokio = { version = "1.39.3", features = ["full"] }
tokio-condvar = "0.3.0"

[dev-dependencies]
criterion = {version = "0.6.0", features =["async_tokio", "async_futures"] }

[[bench]]
name = "rb_benchmarks"
harness = false
